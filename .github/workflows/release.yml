name: Release image

# main에 병합되면 운영 이미지를 빌드해 GitHub 컨테이너 저장소(GHCR)에 올린다.
# 서버의 deploy.sh는 REGISTRY_IMAGE가 설정돼 있으면 서버에서 빌드하지 않고 이 이미지를 받는다.
#   ghcr.io/<owner>/<repo>:<커밋 SHA 40자>   (deploy.sh가 받는 태그)
#   ghcr.io/<owner>/<repo>:main              (main 최신)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name (lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:${{ github.ref_name == 'main' && 'main' || github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        run: |
          {
            echo "### 운영 이미지"
            echo "- \`${{ steps.name.outputs.image }}:${{ github.sha }}\`"
            echo "- 서버: \`cd /srv/taeil/deploy && sudo ./deploy.sh\`"
          } >> "$GITHUB_STEP_SUMMARY"
