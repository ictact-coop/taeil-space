name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taeil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/taeil_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/taeil_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test (unit + DB)
        run: pnpm test
      - name: Migrations apply cleanly
        run: pnpm db:migrate
      - name: Build
        run: pnpm build

  # 운영 이미지가 빌드되고, 마이그레이션 후 웹이 정상 응답하는지 확인한다(배포 전 검증).
  image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taeil_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Deploy scripts and compose file are valid
        run: |
          for f in deploy/*.sh; do bash -n "$f"; done
          # 서버에서는 setup-server.sh가 env.prod.example로 deploy/.env를 만든다
          cp deploy/env.prod.example deploy/.env
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env config -q
          rm deploy/.env
      - name: Build production image
        run: docker build -t taeil-space:ci .
      - name: Smoke test (migrate → seed → web health → preflight)
        run: |
          cat > smoke.env <<ENV
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/taeil_smoke
          APP_ENCRYPTION_KEY=$(openssl rand -base64 32)
          APP_BASE_URL=https://rent.example.org
          EMAIL_PROVIDER=log
          ENV
          docker run --rm --network host --env-file smoke.env taeil-space:ci pnpm db:migrate
          docker run --rm --network host --env-file smoke.env taeil-space:ci pnpm db:seed
          docker run -d --name web --network host --env-file smoke.env taeil-space:ci
          ok=""
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3000/api/health; then ok=1; break; fi
            sleep 2
          done
          [ -n "$ok" ] || { docker logs web; exit 1; }
          curl -sf http://localhost:3000/ | grep -q "전태일기념관"
          # 운영 점검 명령이 실행되는지만 본다(오픈 전 설정이 비어 있어 오류가 나오는 것은 정상)
          docker run --rm --network host --env-file smoke.env taeil-space:ci pnpm preflight || true
