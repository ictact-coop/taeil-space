# 운영 배포 (VM 1대). 보통은 deploy/deploy.sh 로 실행한다. 사용법은 docs/DEPLOYMENT.md 참고.
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
# 같은 VM에 DB를 두려면 .env에 COMPOSE_PROFILES=localdb, DATABASE_URL=postgres://taeil:<비밀번호>@db:5432/taeil
# 관리형 PostgreSQL을 쓰면 COMPOSE_PROFILES에서 localdb를 빼고 DATABASE_URL에 그 주소를 넣는다.
# 외부 이미지는 Docker Hub가 기본값이고, 다운로드 제한에 걸리면 .env의 *_IMAGE로 미러를 지정한다.
name: taeil

x-app: &app
  image: ${APP_IMAGE:-taeil-space:latest}
  env_file: .env
  restart: unless-stopped
  volumes:
    - uploads:/data/uploads
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  # 앱 이미지는 이 서비스에서만 빌드한다(web·worker가 같은 이미지를 쓴다). 시작할 때 마이그레이션을 적용하고 끝난다.
  migrate:
    <<: *app
    build:
      context: ..
    command: ["pnpm", "db:migrate"]
    restart: "no"
    healthcheck: { disable: true }
    depends_on:
      db: { condition: service_healthy, required: false }

  web:
    <<: *app
    depends_on:
      migrate: { condition: service_completed_successfully }
    expose: ["3000"]

  worker:
    <<: *app
    command: ["pnpm", "worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck: { disable: true }

  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN을 설정하세요}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # 첨부파일 악성코드 검사 (메모리 약 1.5GB 필요). 쓰려면 COMPOSE_PROFILES에 clamav, .env에 CLAMAV_HOST=clamav
  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav:stable}
    restart: unless-stopped
    profiles: ["clamav"]

  db:
    image: ${POSTGRES_IMAGE:-postgres:16}
    restart: unless-stopped
    profiles: ["localdb"]
    environment:
      POSTGRES_DB: taeil
      POSTGRES_USER: taeil
      # 비어 있으면 DB가 시작되지 않는다(deploy.sh가 미리 검사)
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taeil -d taeil"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  uploads:
  caddy_data:
  caddy_config:
  pgdata:
